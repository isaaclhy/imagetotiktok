name: Daily quiz your girlfriend

on:
  schedule:
    # 8:20 AM UTC — one cartoon "Quiz your girlfriend" video
    - cron: '20 8 * * *'
  workflow_dispatch:

jobs:
  daily-video:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: cartoon-quiz/requirements.txt

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python renderer
        run: pip install -r cartoon-quiz/requirements.txt

      - name: Download Kokoro voice models
        run: |
          mkdir -p cartoon-quiz/models
          test -s cartoon-quiz/models/kokoro-v1.0.onnx || curl -fsSL -o cartoon-quiz/models/kokoro-v1.0.onnx https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/kokoro-v1.0.onnx
          test -s cartoon-quiz/models/voices-v1.0.bin || curl -fsSL -o cartoon-quiz/models/voices-v1.0.bin https://github.com/thewh1teagle/kokoro-onnx/releases/download/model-files-v1.0/voices-v1.0.bin

      - name: Install Node dependencies
        run: npm ci

      - name: Render the cartoon and save it
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
          MONGODB_URI: ${{ secrets.MONGODB_URI }}
        run: npm run daily:video-template-9
