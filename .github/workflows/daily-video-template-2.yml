name: Daily video template 2

on:
  schedule:
    # 8:00 AM UTC every day — adjust as needed (GitHub cron uses UTC)
    - cron: '0 8 * * *'
  workflow_dispatch:

jobs:
  daily-video:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: npm ci

      - name: Run daily video template 2 job
        env:
          PIXELS_API_KEY: ${{ secrets.PIXELS_API_KEY }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_DRIVE_REFRESH_TOKEN: ${{ secrets.GOOGLE_DRIVE_REFRESH_TOKEN }}
          GOOGLE_DRIVE_FOLDER_ID: ${{ secrets.GOOGLE_DRIVE_FOLDER_ID }}
          GOOGLE_REDIRECT_URI: ${{ secrets.GOOGLE_REDIRECT_URI }}
          DAILY_VIDEO_DRIVE_FOLDER_ID: ${{ secrets.DAILY_VIDEO_DRIVE_FOLDER_ID }}
        run: npm run daily:video-template-2
